<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--panel:rgba(28,34,50,.93);--text:#eef0f6;--muted:#a3adc4;--accent:#fb923c;--line:#363f58}}
:root[data-theme="dark"]{--bg:#10151f;--panel:rgba(28,34,50,.93);--text:#eef0f6;--muted:#a3adc4;--accent:#fb923c;--line:#363f58}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.top{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);max-width:560px;z-index:5;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.top input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:16px}
.btn{padding:9px 13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:14px;cursor:pointer;white-space:nowrap}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#card{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:calc(100% - 24px);max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 15px;z-index:5;font-size:14px;line-height:1.5;box-shadow:0 8px 30px rgba(0,0,0,.2)}
#card b{font-size:16px}#card .m{color:var(--muted)}#card .btn{margin:8px 6px 0 0}
.lbl{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:700;padding:3px 8px;border-radius:9px;background:var(--panel);border:1px solid var(--line);color:var(--text);white-space:nowrap}
.pin{pointer-events:auto;cursor:pointer;border-width:2px}
.st{font-weight:500;font-style:italic;color:var(--muted);background:transparent;border:0}
.num{background:var(--accent);color:#fff;border:0;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;padding:0}
</style>
</head>

var b3=document.createElement('button');b3.className='btn';b3.textContent='👁 360°';b3.onclick=()=>go360(0);fr.appendChild(b3);
addEventListener('keydown',e=>{if(!m3||document.activeElement.tagName==='INPUT')return;var k=e.key;
  if(k==='ArrowLeft'){m3.yaw+=0.1;m3.auto=false}else if(k==='ArrowRight'){m3.yaw-=0.1;m3.auto=false}else if(k==='ArrowUp')m3.pitch=Math.min(1.4,m3.pitch+0.08);else if(k==='ArrowDown')m3.pitch=Math.max(-1.4,m3.pitch-0.08);else if(k==='Escape')exit360()});
function goPage(n){if(rt.on)routeOff(true);setFloor(n);intro();fly(new THREE.Vector3(0,(n-1)*FH,2),105,0.3)}
function fromHash(){if(m3)return;goPage(+((location.hash.match(/tang([123])/)||[])[1]||1))}
addEventListener('hashchange',fromHash);fromHash();
// vòng lặp
var v3=new THREE.Vector3(),last=performance.now();
function size(){var w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
function loop(now){var dt=Math.min((now-last)/1000,0.05);last=now;
  if(goal){var k=1-Math.pow(0.002,dt);tgt.lerp(goal.t,k);rad+=(goal.r-rad)*k;ph+=(goal.p-ph)*k;if(tgt.distanceTo(goal.t)<0.1)goal=null}
  if(rt.on){mk2.scale.setScalar(1+0.15*Math.sin(now/180));
    if(rt.mv){var a=RP[rt.i],b=RP[rt.i+1],len=a.distanceTo(b)||1;rt.seg+=dt*14/len;mk2.position.lerpVectors(a,b,Math.min(rt.seg,1));var ff=fl(mk2.position.y);if(ff!==sel)setFloor(ff);tgt.lerp(mk2.position,0.04);
      if(rt.seg>=1){rt.i++;rt.seg=0;if(rt.i===rt.tgt){rt.mv=false;rt.k++;showStop(rt.k);rt.wait=3.5}}}
    else if(rt.auto){rt.wait-=dt;if(rt.wait<=0)nextS()}}
  peopleStep(dt,now);if(m3&&m3.auto)m3.yaw+=dt*0.25;PN.forEach(p=>{var s=cur&&cur.id===p.z.id?1.25+0.12*Math.sin(now/200):1;p.pad.scale.set(s,1,s)});
  apply();var w=innerWidth,h=innerHeight;
  LB.forEach(o=>{v3.copy(o.v).project(cam);var ok=o.vis&&v3.z<1;o.el.style.display=ok?'flex':'none';if(o.el.classList.contains('num')===false)o.el.style.display=ok?'block':'none';
    if(ok){o.el.style.left=(v3.x*0.5+0.5)*w+'px';o.el.style.top=(-v3.y*0.5+0.5)*h+'px'}});
  R.render(S,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
